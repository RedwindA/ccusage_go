name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify dependencies
        run: go mod verify
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/ccusage
      - name: Test installers
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Install the latest release with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:INSTALL_DIR = "$env:RUNNER_TEMP\ccusage_go"
          $env:CCUSAGE_GO_NO_MODIFY_PATH = '1'
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:INSTALL_DIR\ccusage_go.exe" --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check shell scripts
        if: runner.os == 'Linux'
        run: shellcheck install.sh scripts/build-release.sh
