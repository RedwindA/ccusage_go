name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/build.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build release archive
        env:
          VERSION: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: sh scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ccusage_go-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Prepare checksums and release notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cp install.sh dist/install.sh
          (cd dist && sha256sum -- *.tar.gz *.zip install.sh > checksums.txt)
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ['VERSION']
          changelog = Path('CHANGELOG.md').read_text()
          heading = f'## [{version}]'
          if heading not in changelog:
              raise SystemExit(f'Missing changelog entry for {version}')
          notes = changelog.split(heading, 1)[1].split('\n', 1)[1].split('\n## [', 1)[0].strip()
          notes += f'\n\n### Installation (Linux / macOS)\n\n```sh\ncurl -fsSL https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/{version}/install.sh | sh -s -- {version}\n```\n\nWindows: download the matching ZIP. SHA-256 checksums are in `checksums.txt`.\n'
          Path('release-notes.md').write_text(notes)
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          args=()
          if [[ "$VERSION" == *-* ]]; then args+=(--prerelease); fi
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --verify-tag --draft \
              --title "ccusage_go $VERSION" --notes-file release-notes.md "${args[@]}"
          fi
          gh release upload "$VERSION" dist/*.tar.gz dist/*.zip dist/checksums.txt dist/install.sh --clobber
          gh release edit "$VERSION" --draft=false --notes-file release-notes.md "${args[@]}"
